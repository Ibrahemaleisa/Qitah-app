name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing by default, each job opts in.
permissions: {}

jobs:
  api:
    name: API (typecheck, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qitah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      # The API test suite requires a database whose name ends in _test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qitah_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qitah_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Build (tsconfig.build.json)
        run: npm run build

  api-image:
    name: API container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          platforms: linux/amd64
          push: false
          tags: qitah-api:ci
          cache-from: type=gha,scope=qitah-api
          cache-to: type=gha,mode=max,scope=qitah-api

  infra:
    name: Infra (typecheck, tests, cdk synth)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests (assertions + cdk-nag AwsSolutions)
        run: npm test
      # Synth must work with dummy account ids and NO AWS credentials.
      - name: cdk synth staging
        run: npx cdk synth --quiet -c env=staging -c stagingAccount=111111111111 -c "imageTag=$IMAGE_TAG"
      - name: cdk synth production
        run: npx cdk synth --quiet -c env=production -c productionAccount=222222222222 -c "imageTag=$IMAGE_TAG"
      - name: Fail on cdk-nag findings
        run: |
          node -e '
            const r = require("./cdk.out/validation-report.json");
            const v = r.pluginReports.flatMap(p => p.pluginName === "AwsSolutions" ? (p.violations || []) : []);
            if (v.length) { console.error(JSON.stringify(v.map(x => x.ruleName), null, 2)); process.exit(1); }
            console.log("cdk-nag: no unacknowledged findings");
          '

  app:
    name: Customer app (typecheck, jest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  portals:
    name: Portal build (${{ matrix.portal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        portal: [merchant, ops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hashFiles() is not available in job-level `if`, so every step is guarded instead.
      - name: Skip notice
        if: hashFiles(format('portals/{0}/package.json', matrix.portal)) == ''
        run: echo "portals/${{ matrix.portal }} does not exist yet - skipping."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('portals/{0}/package.json', matrix.portal)) != ''
        with:
          node-version: 22
      - name: Install
        if: hashFiles(format('portals/{0}/package.json', matrix.portal)) != ''
        working-directory: portals/${{ matrix.portal }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build
        if: hashFiles(format('portals/{0}/package.json', matrix.portal)) != ''
        working-directory: portals/${{ matrix.portal }}
        env:
          API_BASE_URL: http://localhost:4000
          AUTH_MODE: local
          COGNITO_REGION: eu-central-1
          COGNITO_CLIENT_ID: ci-placeholder
        run: npm run build
