<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قطعة | بوابة العمليات التجريبية</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#162331;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102c54;color:white;padding:22px max(22px,calc((100vw - 1150px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}main{max-width:1150px;margin:auto;padding:30px 20px}.muted{color:#687689}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{background:#164c91;color:white;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit}button.secondary{background:#e9eef5;color:#16375d}button:disabled{opacity:.4}input,select{border:1px solid #ccd5df;border-radius:9px;padding:11px;width:100%;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px}.panel h3{margin-top:0}form{display:grid;gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:right}small{color:#738195}.pill{background:#eef4fc;border-radius:20px;padding:5px 10px;display:inline-block;font-size:12px}#notice{white-space:pre-wrap;min-height:20px;margin-top:10px}.warn{background:#fff4d7;color:#6d4b06;padding:12px;border-radius:10px}section[hidden]{display:none}.metric{font-size:30px;font-weight:700}a{color:#164c91}@media(max-width:600px){table{display:block;overflow:auto}header{padding:18px}}</style></head><body><header><strong>قطعة <small style="color:#b9d1ed">Qitah Operations</small></strong><span>بيئة تجريبية فقط · Sandbox</span></header><main><div class="warn">هذه البوابة للتطوير الداخلي محليًا فقط. لا يوجد تسجيل دخول آمن أو ربط دفع وشحن حقيقي. لا تدخل بيانات عملاء حقيقية.</div><div class="tabs"><button onclick="tab('merchants')">بوابة التاجر</button><button class="secondary" onclick="tab('warehouse')">بوابة المستودع التقني</button><button class="secondary" onclick="tab('orders')">الطلبات والإرجاع</button></div><p id="notice"></p>
<section id="merchants"><div class="grid"><div class="panel"><h3>تسجيل تاجر تجريبي</h3><form id="merchantForm"><input name="name" placeholder="اسم المتجر" required minlength="2"><input name="city" placeholder="المدينة" value="الرياض" required><input name="address" placeholder="عنوان الاستلام" required minlength="4"><button>إنشاء التاجر</button></form></div><div class="panel"><h3>إضافة منتج</h3><form id="productForm"><input name="sku" placeholder="رمز القطعة SKU" required><input name="titleAr" placeholder="اسم القطعة" required><input name="category" placeholder="التصنيف" required><button>إضافة المنتج</button></form></div><div class="panel"><h3>عرض تاجر</h3><form id="offerForm"><select name="merchantId" id="offerMerchant" required></select><select name="locationId" id="offerLocation" required></select><select name="productId" id="offerProduct" required></select><input name="price" type="number" min="1" step=".01" placeholder="السعر بالريال" required><input name="stock" type="number" min="0" step="1" placeholder="الكمية" required><button>نشر العرض</button></form></div></div><div class="panel"><h3>التجار</h3><div id="merchantList"></div></div></section>
<section id="warehouse" hidden><div class="grid" id="summary"></div><div class="panel"><h3>طابور الشحنات</h3><div id="shipmentList"></div></div></section>
<section id="orders" hidden><div class="panel"><h3>إنشاء طلب تجريبي</h3><form id="orderForm"><input name="phone" placeholder="معرّف هاتف تجريبي (لا تستخدم رقمًا حقيقيًا)" value="sandbox-customer-001" required><select name="offerIds" id="orderOffer" required></select><button>إنشاء طلب</button></form></div><div class="panel"><h3>الطلبات</h3><div id="orderList"></div></div></section>
</main><script>
const base=location.hostname==="localhost"||location.hostname==="127.0.0.1"?"http://127.0.0.1:4000":location.origin;let merchants=[],products=[],orders=[];
const el=id=>document.getElementById(id);const money=n=>(n/100).toFixed(2)+" ر.س";
async function api(path,method="GET",data){const res=await fetch(base+path,{method,headers:{"Content-Type":"application/json"},body:data?JSON.stringify(data):undefined});const json=await res.json();if(!res.ok)throw Error(json.error||"Request failed");return json}
function notify(msg){el("notice").textContent=msg;setTimeout(()=>el("notice").textContent="",7000)}
function tab(name){document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==name);refresh()}
function option(select,rows,label){select.innerHTML=rows.map(x=>'<option value="'+x.id+'">'+label(x)+'</option>').join("")}
async function refresh(){try{[merchants,products,orders]=await Promise.all([api("/api/merchants"),api("/api/products"),api("/api/orders")]);option(el("offerMerchant"),merchants.filter(m=>m.status==="APPROVED"),m=>m.name);syncLocations();option(el("offerProduct"),products,p=>p.titleAr+" · "+p.sku);option(el("orderOffer"),products.flatMap(p=>p.offers.map(o=>({...o,title:p.titleAr}))),o=>o.title+" · "+money(o.priceHalalas));el("merchantList").innerHTML=merchants.map(m=>'<p><b>'+esc(m.name)+'</b> · '+esc(m.status)+' · '+m.locations.map(l=>esc(l.city)).join(", ")+' <button onclick="approve(\''+m.id+'\')" '+(m.status!=="PENDING"?"disabled":"")+'>اعتماد</button></p>').join("")||"لا يوجد تجار";el("orderList").innerHTML=orders.map(o=>'<div class="panel"><b>'+esc(o.id.slice(-8))+'</b> <span class="pill">'+o.status+'</span> · '+money(o.totalHalalas)+' '+(o.status==="AWAITING_PAYMENT"?'<button onclick="pay(\''+o.id+'\')">محاكاة الدفع</button>':"")+'<div>'+o.suborders.map(s=>'<p>تاجر: '+esc(s.merchant.name)+' · '+s.status+' '+(o.status!=="AWAITING_PAYMENT"?'<button class="secondary" onclick="nextSub(\''+s.id+'\',\''+s.status+'\')">المرحلة التالية</button>':"")+'</p>').join("")+'</div><button class="secondary" onclick="returnOrder(\''+o.id+'\')">طلب إرجاع تجريبي</button></div>').join("")||"لا توجد طلبات";el("shipmentList").innerHTML=orders.flatMap(o=>o.suborders.flatMap(s=>s.shipments.map(sh=>({sh,s,o})))).map(({sh,s,o})=>'<p><b>'+esc(sh.id.slice(-8))+'</b> · '+esc(s.merchant.name)+' · '+sh.status+' · '+money(sh.shippingHalalas)+' <button onclick="nextShip(\''+sh.id+'\',\''+sh.status+'\')" '+(o.status==="AWAITING_PAYMENT"?"disabled":"")+'>تحديث الشحنة</button></p>').join("")||"لا توجد شحنات";const sum=await api("/api/operations/summary");el("summary").innerHTML=Object.entries(sum).map(([k,v])=>'<div class="panel"><small>'+k+'</small><div class="metric">'+v+'</div></div>').join("")}catch(e){notify("تعذر الاتصال بالخدمة المحلية: "+e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function syncLocations(){const m=merchants.find(x=>x.id===el("offerMerchant").value);option(el("offerLocation"),m?.locations||[],l=>l.name+" · "+l.city)}
el("offerMerchant").onchange=syncLocations;
async function act(fn){try{await fn();await refresh()}catch(e){notify(e.message)}}
el("merchantForm").onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));act(()=>api("/api/merchants","POST",x))};
el("productForm").onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));act(()=>api("/api/products","POST",{...x,fitmentJson:{}}))};
el("offerForm").onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));act(()=>api("/api/offers","POST",{...x,priceHalalas:Math.round(Number(x.price)*100),stock:Number(x.stock)}))};
el("orderForm").onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.target));act(()=>api("/api/sandbox/orders","POST",{phone:x.phone,offerIds:[x.offerIds],idempotencyKey:crypto.randomUUID()}))};
function approve(id){act(()=>api("/api/merchants/"+id+"/approve","PATCH"))}
function pay(id){act(()=>api("/api/sandbox/orders/"+id+"/pay","POST"))}
function nextSub(id,status){const seq=["NEW","ACCEPTED","PACKING","READY","HANDED_OFF","DELIVERED"];const next=seq[seq.indexOf(status)+1];if(next)act(()=>api("/api/suborders/"+id+"/status","PATCH",{status:next}))}
function nextShip(id,status){const seq=["DRAFT","LABEL_CREATED","PICKUP_REQUESTED","PICKED_UP","IN_TRANSIT","DELIVERED"];const next=seq[seq.indexOf(status)+1];if(next)act(()=>api("/api/shipments/"+id+"/status","PATCH",{status:next,note:"Sandbox transition"}))}
function returnOrder(id){act(()=>api("/api/returns","POST",{orderId:id,reason:"Sandbox return requested by test customer"}))}
refresh();
</script></body></html>
